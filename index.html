<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fontaine Software</title>
  <meta name="description" content="Fontaine Software makes Pylon Pitch, turn-based table soccer with real physics for Android.">
  <link rel="icon" href="pylon-pitch-icon.png">
  <style>
    :root {
      --bg: #f5f6f0; --card: #ffffff; --text: #16201a; --muted: #56615a;
      --accent: #2e7d32; --accent-text: #ffffff; --border: #dde2d8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1512; --card: #17211c; --text: #e8efe9; --muted: #a3b0a7;
        --accent: #6fcf73; --accent-text: #0e1512; --border: #26332c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text); line-height: 1.5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px 32px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .tagline { margin: 0 0 32px; color: var(--muted); }
    .game {
      display: flex; gap: 20px; align-items: flex-start;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    }
    .game img { width: 96px; height: 96px; border-radius: 22px; flex: none; }
    .game h2 { margin: 0 0 4px; font-size: 1.25rem; }
    .game p { margin: 0 0 14px; color: var(--muted); }
    .links { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
    .button {
      display: inline-block; background: var(--accent); color: var(--accent-text);
      text-decoration: none; padding: 10px 16px; border-radius: 10px; font-weight: 600;
    }
    a { color: var(--accent); }
    footer { margin-top: 32px; color: var(--muted); font-size: 0.9rem; }
    footer p { margin: 0 0 4px; }
    @media (max-width: 480px) { .game { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <h1>Fontaine Software</h1>
    <p class="tagline">Independent games for Android.</p>

    <section class="game">
      <img src="pylon-pitch-icon.png" alt="Pylon Pitch app icon" width="96" height="96">
      <div>
        <h2>Pylon Pitch</h2>
        <p>Turn-based table soccer with real physics. Flick your pylons, bank shots off the walls and climb the soccer ranks.</p>
        <div class="links">
          <a class="button" href="https://play.google.com/store/apps/details?id=com.fontainesoftware.pylonpitch">Get it on Google Play</a>
          <a href="https://bjorn1500.github.io/pylonpitch-privacy/">Privacy policy</a>
        </div>
      </div>
    </section>

    <footer>
      <p>Contact: <a href="mailto:fontaine-software@outlook.com">fontaine-software@outlook.com</a></p>
      <p>&copy; 2026 Fontaine Software</p>
    </footer>
  </main>
</body>
</html>
